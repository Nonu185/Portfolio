<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262a35"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
  </defs>
  <!-- Terminal Body -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5"/>
  <!-- Top Window Header Line -->
  <line x1="6" y1="30" x2="122" y2="30" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- macOS Traffic Dots -->
  <circle cx="22" cy="18" r="4" fill="#ff5f56"/>
  <circle cx="34" cy="18" r="4" fill="#ffbd2e"/>
  <circle cx="46" cy="18" r="4" fill="#27c93f"/>
  <!-- CLI Prompt `> _` -->
  <path d="M26 52 L50 70 L26 88" fill="none" stroke="#4ade80" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="58" y1="88" x2="86" y2="88" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
</svg>

